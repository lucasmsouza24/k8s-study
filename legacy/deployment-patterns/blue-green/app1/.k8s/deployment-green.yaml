apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-green
  labels:
    app: app1-green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1-green
  template:
    metadata:
      labels:
        app: app1-green
    spec:
      containers:
      - name: app1-green
        image: docker.io/library/app1:v1.1
        ports:
        - containerPort: 8080
