apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: aval-k1
  labels:
    app: echo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: hashicorp/http-eco:0.2.3
          args:
            - "-listen=:5678"
            - "-text=$(MESSAGE)"
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: echo-config
                  key: MESSAGE
          ports:
            - containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Gi
            limits:
              cpu: 100m
              memory: 64Gi
